name: PR Checks

# Fast gate that must be green before anything reaches TestFlight.
#
# Two jobs run in parallel:
#   core  — swift test on the ReaCore package (no Xcode project needed)
#   build — xcodegen + unsigned simulator build, which is the first real
#           compile of the SwiftUI layer
#
# iPhone 13 Pro is the pinned simulator for the build smoke test.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Rea
  SIM_DEVICE: iPhone 13 Pro

jobs:
  core:
    name: ReaCore tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: swift test
        run: |
          set -euo pipefail
          swift test --parallel 2>&1 | tee swift-test.log

      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "::group::errors and notes"
          grep -nE 'error:|warning:|note: ' swift-test.log || echo "(no diagnostics found)"
          echo "::endgroup::"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: ignore

  build:
    name: Simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project Rea.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee xcodebuild.log

      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "::group::errors and notes"
          grep -nE 'error:|warning:|note: ' xcodebuild.log || echo "(no diagnostics found)"
          echo "::endgroup::"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  gate:
    name: Gate
    needs: [core, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail unless both jobs passed
        run: |
          set -euo pipefail
          core="${{ needs.core.result }}"
          build="${{ needs.build.result }}"
          echo "core=$core build=$build"
          if [ "$core" != "success" ] || [ "$build" != "success" ]; then
            echo "::error::PR checks failed (core=$core, build=$build)"
            exit 1
          fi
          echo "All checks passed."
